<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Gestão 2026</title>
<style>
/* ── FONT via @font-face fallback stack ── */
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap');
:root {
  --yellow:#D8E63C; --yellow-dk:#b5c400; --yellow-lt:#F5FAB0;
  --violet:#D6B4FC; --violet-dk:#9B59F5; --violet-lt:#F3E8FF;
  --blue-dk:#17184B; --blue-md:#273287; --blue-lt:#D3DDE7;
  --bg:#F5F5F2; --surface:#FFFFFF; --surface2:#F0EEE9;
  --border:#EAEAE4;
  --pos:#1A7F5A; --pos-bg:#E6F7F1;
  --neg:#C0392B; --neg-bg:#FDECEA;
  --text:#17184B; --text2:#555577; --text3:#AAAABC;
  --font:'Poppins',system-ui,-apple-system,sans-serif;
  --r:20px; --r-sm:14px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;font-family:var(--font);background:var(--bg);color:var(--text);font-size:14px;-webkit-font-smoothing:antialiased}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-thumb{background:#ddd;border-radius:4px}

/* ── LAYOUT ── */
.shell{display:flex;flex-direction:column;min-height:100dvh;max-width:430px;margin:0 auto}
@media(min-width:900px){
  .shell{flex-direction:row;max-width:1140px}
  #sidebar{display:flex!important}
  #bottom-nav{display:none!important}
  #top-bar{display:none!important}
  #main{padding:32px 36px 40px}
  .cards-row{grid-template-columns:repeat(4,1fr)!important}
  .dash-charts{grid-template-columns:1fr 1fr!important}
  .form-row{grid-template-columns:1fr 1fr!important}
}

/* SIDEBAR */
#sidebar{display:none;flex-direction:column;width:220px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--border);padding:28px 16px;position:sticky;top:0;height:100dvh;overflow-y:auto}
.s-logo{padding:4px 8px 24px;border-bottom:1px solid var(--border);margin-bottom:12px}
.s-logo h1{font-size:18px;font-weight:700;letter-spacing:-.3px}
.s-logo h1 em{font-style:normal;color:var(--violet-dk)}
.s-logo p{font-size:11px;color:var(--text3);margin-top:1px}
.snav{display:flex;flex-direction:column;gap:3px}
.snav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;font-size:13px;font-weight:500;color:var(--text2);cursor:pointer;transition:.15s;user-select:none}
.snav-item:hover{background:var(--surface2)}
.snav-item.active{background:var(--blue-dk);color:#fff}
.s-bottom{margin-top:auto;padding-top:16px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:6px}

/* TOP BAR */
#top-bar{display:flex;align-items:center;justify-content:space-between;padding:14px 18px 10px;background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:50}
.top-logo{font-size:17px;font-weight:700}
.top-logo em{font-style:normal;color:var(--violet-dk)}
.top-actions{display:flex;gap:6px}

/* MAIN */
#main{flex:1;padding:18px 16px 96px;overflow-y:auto}

/* BOTTOM NAV */
#bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:rgba(255,255,255,.94);backdrop-filter:blur(18px);border-top:1px solid var(--border);display:flex;padding:8px 0 calc(8px + env(safe-area-inset-bottom));z-index:50}
.bnav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;padding:3px 0;color:var(--text3);font-size:10px;font-weight:500;transition:.15s;user-select:none}
.bnav-item.active{color:var(--blue-dk)}
.bnav-icon{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;transition:.15s}
.bnav-item.active .bnav-icon{background:var(--yellow);box-shadow:0 2px 8px rgba(216,230,60,.4)}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 13px;border-radius:10px;border:1px solid var(--border);background:var(--surface2);color:var(--text2);font-family:var(--font);font-size:12px;font-weight:500;cursor:pointer;transition:.15s;white-space:nowrap}
.btn:hover{border-color:var(--violet-dk);color:var(--text);background:var(--violet-lt)}
.btn-yellow{background:var(--yellow);border-color:var(--yellow-dk);color:var(--blue-dk);font-size:15px;font-weight:600;width:100%;justify-content:center;padding:14px;border-radius:14px;font-family:var(--font)}
.btn-yellow:hover{background:var(--yellow-dk);color:#fff}
.btn-green{background:var(--pos);border-color:#155a3e;color:#fff;font-size:15px;font-weight:600;width:100%;justify-content:center;padding:14px;border-radius:14px;font-family:var(--font)}
.btn-green:hover{background:#155a3e}

/* PAGE HEADER */
.ph{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:18px;gap:10px;flex-wrap:wrap}
.ph-title{font-size:22px;font-weight:700;letter-spacing:-.4px}
.ph-sub{font-size:11px;color:var(--text3);margin-top:1px}
.mpill{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:6px 14px;font-family:var(--font);font-size:12px;font-weight:500;color:var(--text2);cursor:pointer;appearance:none;outline:none}
.mpill:focus{border-color:var(--violet-dk)}

/* HERO */
.hero{background:var(--blue-dk);border-radius:var(--r);padding:22px 20px;margin-bottom:12px;position:relative;overflow:hidden}
.hero::before{content:'';position:absolute;width:140px;height:140px;border-radius:50%;background:rgba(216,230,60,.12);right:-30px;top:-40px}
.hero::after{content:'';position:absolute;width:90px;height:90px;border-radius:50%;background:rgba(214,180,252,.1);right:50px;bottom:-30px}
.hero-lbl{font-size:11px;font-weight:500;color:rgba(255,255,255,.5);text-transform:uppercase;letter-spacing:.6px;margin-bottom:6px}
.hero-val{font-size:36px;font-weight:700;letter-spacing:-2px;line-height:1;color:#fff}
.hero-chips{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.hchip{border-radius:20px;padding:5px 12px;font-size:12px;font-weight:600;display:inline-flex;align-items:center;gap:5px}
.hchip.in{background:var(--yellow);color:var(--blue-dk)}
.hchip.out{background:rgba(214,180,252,.25);color:var(--violet)}

/* ACCOUNT CARDS */
.cards-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.acard{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:16px;position:relative;overflow:hidden;transition:.2s}
.acard:hover{box-shadow:0 4px 20px rgba(0,0,0,.07)}
.acard-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.acard-icon{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;background:rgba(255,255,255,.6)}
.acard-lbl{font-size:10px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px}
.acard-val{font-size:20px;font-weight:700;letter-spacing:-.8px;line-height:1.1}
.acard-meta{font-size:10px;color:var(--text3);margin-top:5px;display:flex;gap:8px}
.m-in{color:var(--pos);font-weight:600}.m-out{color:var(--neg);font-weight:600}
.acard.yellow-card{background:var(--yellow)}
.acard.yellow-card .acard-lbl,.acard.yellow-card .acard-meta{color:rgba(23,24,75,.5)}
.acard.yellow-card .acard-val{color:var(--blue-dk)}
.acard.violet-card{background:var(--violet-lt);border-color:var(--violet)}
.acard.violet-card .acard-val{color:var(--violet-dk)}

/* CHART CARDS */
.dash-charts{display:grid;grid-template-columns:1fr;gap:12px;margin-bottom:14px}
.chart-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:20px}
.cc-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.cc-title{font-size:14px;font-weight:600}
.cc-pill{font-size:11px;font-weight:500;background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:3px 10px;color:var(--text2)}
.stat-row{display:flex;gap:24px;margin-bottom:14px}
.stat-lbl{font-size:11px;color:var(--text3);margin-bottom:2px}
.stat-val{font-size:22px;font-weight:700;letter-spacing:-1px}

/* Canvas charts */
canvas{display:block}

/* Bubbles */
.bubble-row{display:flex;align-items:center;justify-content:center;gap:0;margin-bottom:14px;height:110px}
.bubble{border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0}
.b-icon{font-size:20px;line-height:1}
.b-lbl{font-size:9px;font-weight:600;margin-top:2px;opacity:.75}

/* Progress bars */
.prog-list{display:flex;flex-direction:column;gap:9px}
.prog-hd{display:flex;justify-content:space-between;font-size:12px;font-weight:500;margin-bottom:4px}
.prog-bar{height:6px;background:var(--surface2);border-radius:3px;overflow:hidden}
.prog-fill{height:100%;border-radius:3px;transition:width .8s}

/* Rate card */
.rate-num{font-size:44px;font-weight:700;letter-spacing:-2px;line-height:1;margin:6px 0 3px}
.rate-bar{height:8px;background:var(--surface2);border-radius:4px;margin-top:12px;overflow:hidden}
.rate-fill{height:100%;border-radius:4px;transition:width .8s}
.fix-var-row{display:flex;gap:8px;margin-top:14px}
.fv-box{flex:1;border-radius:14px;padding:12px;text-align:center}
.fv-lbl{font-size:11px;font-weight:600;margin-bottom:4px}
.fv-val{font-size:17px;font-weight:700;letter-spacing:-.5px}
.fv-pct{font-size:10px;margin-top:2px}

/* FORM */
.form-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:20px;margin-bottom:14px}
.type-toggle{display:flex;background:var(--surface2);border-radius:12px;padding:3px;gap:3px;margin-bottom:20px}
.tog-btn{flex:1;padding:9px 0;border-radius:10px;border:none;font-family:var(--font);font-size:13px;font-weight:600;cursor:pointer;transition:.2s;background:transparent;color:var(--text3)}
.tog-btn.active-expense{background:var(--blue-dk);color:#fff}
.tog-btn.active-income{background:var(--pos);color:#fff}
.form-stack{display:flex;flex-direction:column;gap:12px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fg{display:flex;flex-direction:column;gap:5px}
.flbl{font-size:11px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.5px}
.fi,.fs{background:var(--surface2);border:1.5px solid var(--border);border-radius:12px;padding:12px 14px;color:var(--text);font-family:var(--font);font-size:14px;font-weight:400;outline:none;transition:.15s;width:100%;appearance:none}
.fi:focus,.fs:focus{border-color:var(--violet-dk);box-shadow:0 0 0 3px rgba(155,89,245,.1);background:#fff}
.fi::placeholder{color:var(--text3)}
.value-fi{font-size:24px;font-weight:700;letter-spacing:-.5px;caret-color:transparent}

/* QUICK BALS */
.quick-bals{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.qbal{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-sm);padding:12px 14px}
.qbal-lbl{font-size:10px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px}
.qbal-val{font-size:17px;font-weight:700;letter-spacing:-.4px}
.qbal-val.pos{color:var(--pos)}.qbal-val.neg{color:var(--neg)}

/* EXTRATO */
.table-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);overflow:hidden}
.table-hd{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.table-title{font-size:14px;font-weight:600}
.tcount{font-size:11px;font-weight:600;background:var(--yellow);color:var(--blue-dk);padding:3px 10px;border-radius:20px}
.tx-list{display:flex;flex-direction:column}
.tx-item{display:flex;align-items:center;gap:11px;padding:12px 18px;border-bottom:1px solid var(--border);transition:.1s}
.tx-item:last-child{border-bottom:none}
.tx-item:hover{background:#fafafa}
.cat-icon{width:42px;height:42px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.tx-body{flex:1;min-width:0}
.tx-name{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx-tags{display:flex;align-items:center;gap:3px;margin-top:2px;flex-wrap:wrap}
.tx-detail{font-size:11px;color:var(--text3);margin-top:1px}
.tx-right{text-align:right;flex-shrink:0}
.tx-amt{font-size:14px;font-weight:700;letter-spacing:-.3px}
.tx-amt.out{color:var(--neg)}.tx-amt.in{color:var(--pos)}
.tx-dt{font-size:10px;color:var(--text3);margin-top:1px}
.tx-del{background:none;border:none;cursor:pointer;color:var(--text3);padding:4px;border-radius:6px;font-size:16px;transition:.15s;flex-shrink:0;line-height:1}
.tx-del:hover{color:var(--neg)}
.tag{display:inline-flex;align-items:center;padding:1px 7px;border-radius:20px;font-size:10px;font-weight:600;white-space:nowrap}
.tag-fixo{background:#FFF8E1;color:#B45309}
.tag-var{background:var(--violet-lt);color:var(--violet-dk)}
.tag-dinheiro{background:var(--pos-bg);color:var(--pos)}
.tag-va{background:#FFF7ED;color:#C2410C}
.tag-cultura{background:var(--violet-lt);color:var(--violet-dk)}
.tag-poupanca{background:#EFF6FF;color:#1D4ED8}
.table-footer{padding:12px 18px;border-top:1px solid var(--border);background:var(--surface2);display:flex;gap:18px;flex-wrap:wrap;font-size:12px;font-weight:500;color:var(--text2)}
.table-footer strong{color:var(--text);font-weight:700}

.empty{padding:40px 24px;text-align:center;color:var(--text3);font-size:13px;line-height:1.8}
#toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:var(--blue-dk);color:#fff;padding:11px 22px;border-radius:20px;font-size:13px;font-weight:500;z-index:200;white-space:nowrap;box-shadow:0 4px 24px rgba(23,24,75,.2);display:none;animation:fadeUp .25s ease}
@keyframes fadeUp{from{opacity:0;transform:translateX(-50%) translateY(8px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
@media(min-width:900px){#toast{bottom:28px}}
input[type=file]{display:none}
.legend-row{display:flex;align-items:center;gap:14px;font-size:11px;font-weight:600;color:var(--text2)}
.leg-dot{width:10px;height:10px;border-radius:3px;display:inline-block}
</style>
</head>
<body>
<div class="shell">

  <!-- SIDEBAR -->
  <aside id="sidebar">
    <div class="s-logo">
      <h1>Gestão <em>2026</em></h1>
      <p>controle financeiro pessoal</p>
    </div>
    <nav class="snav" id="snav">
      <div class="snav-item active" data-page="dashboard">🏠 Início</div>
      <div class="snav-item" data-page="lancamento">➕ Lançar</div>
      <div class="snav-item" data-page="extrato">📋 Extrato</div>
    </nav>
    <div class="s-bottom">
      <button class="btn" onclick="exportBk()">💾 Exportar Backup</button>
      <label class="btn" for="imp-d" style="cursor:pointer">📥 Importar Backup</label>
      <input type="file" id="imp-d" accept=".json" onchange="importBk(this)">
    </div>
  </aside>

  <!-- TOP BAR -->
  <div id="top-bar">
    <div class="top-logo">Gestão <em>2026</em></div>
    <div class="top-actions">
      <button class="btn" onclick="exportBk()">💾</button>
      <label class="btn" for="imp-m" style="cursor:pointer">📥</label>
      <input type="file" id="imp-m" accept=".json" onchange="importBk(this)">
    </div>
  </div>

  <!-- MAIN -->
  <main id="main"></main>

  <!-- BOTTOM NAV -->
  <nav id="bottom-nav">
    <div class="bnav-item active" data-page="dashboard"><div class="bnav-icon">🏠</div>Início</div>
    <div class="bnav-item" data-page="lancamento"><div class="bnav-icon">➕</div>Lançar</div>
    <div class="bnav-item" data-page="extrato"><div class="bnav-icon">📋</div>Extrato</div>
  </nav>
</div>

<div id="toast"></div>

<script>
/* ─── DATA ─────────────────────────────────────── */
const LS = 'gestao2026_v3';
const MONTHS = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];

const CAT_META = {
  'Alimentação': {icon:'🍽️', bg:'#FFF3E0'},
  'Casa':        {icon:'🏠', bg:'#E3F2FD'},
  'Mobilidade':  {icon:'🚗', bg:'#F3E5F5'},
  'Lazer':       {icon:'🎉', bg:'#FCE4EC'},
  'Telefone':    {icon:'📱', bg:'#E8F5E9'},
  'Pessoal':     {icon:'👤', bg:'#FFF8E1'},
  'Saúde':       {icon:'💊', bg:'#FFEBEE'},
  'Educação':    {icon:'📚', bg:'#E0F7FA'},
  'Estética':    {icon:'💅', bg:'#FCE4EC'},
  'Investimento':{icon:'📈', bg:'#E8F5E9'},
  'Viagem':      {icon:'✈️', bg:'#E3F2FD'},
  'Trabalho':    {icon:'💼', bg:'#F3E5F5'},
  'Entrada':     {icon:'💰', bg:'#E6F7F1'},
};
const catIcon = c => (CAT_META[c]||{icon:'💸'}).icon;
const catBg   = c => (CAT_META[c]||{bg:'#F5F5F5'}).bg;

const CONTA_META = {
  dinheiro:{icon:'💵',label:'Dinheiro / Pix', tagCls:'tag-dinheiro'},
  va:      {icon:'🍱',label:'Vale Alimentação',tagCls:'tag-va'},
  cultura: {icon:'🎭',label:'Vale Cultura',    tagCls:'tag-cultura'},
  poupanca:{icon:'🏦',label:'Poupança',        tagCls:'tag-poupanca'},
};

const CATS_DATA = [
  {custo:'Custo Variável',cat:'Alimentação',prod:'Supermercado'},
  {custo:'Custo Variável',cat:'Alimentação',prod:'Restaurante'},
  {custo:'Custo Fixo',    cat:'Alimentação',prod:'Sacolão'},
  {custo:'Custo Fixo',    cat:'Casa',       prod:'Aluguel/ IPTU/ Condomínio'},
  {custo:'Custo Fixo',    cat:'Casa',       prod:'Internet'},
  {custo:'Custo Fixo',    cat:'Casa',       prod:'CEMIG'},
  {custo:'Custo Fixo',    cat:'Casa',       prod:'Gás'},
  {custo:'Custo Variável',cat:'Casa',       prod:'Reparos casa'},
  {custo:'Custo Fixo',    cat:'Casa',       prod:'Faxina'},
  {custo:'Custo Fixo',    cat:'Educação',   prod:'Estudos/ cursos'},
  {custo:'Custo Variável',cat:'Estética',   prod:'Salão Cabelo'},
  {custo:'Custo Variável',cat:'Estética',   prod:'Manicure'},
  {custo:'Custo Variável',cat:'Lazer',      prod:'Rolê'},
  {custo:'Custo Variável',cat:'Lazer',      prod:'Lanches'},
  {custo:'Custo Variável',cat:'Mobilidade', prod:'Uber/99'},
  {custo:'Custo Variável',cat:'Mobilidade', prod:'Gasolina'},
  {custo:'Custo Variável',cat:'Pessoal',    prod:'Presente'},
  {custo:'Custo Variável',cat:'Pessoal',    prod:'Roupa'},
  {custo:'Custo Variável',cat:'Pessoal',    prod:'Decoração'},
  {custo:'Custo Variável',cat:'Pessoal',    prod:'Casinha'},
  {custo:'Custo Variável',cat:'Investimento',prod:'Reserva'},
  {custo:'Custo Variável',cat:'Saúde',      prod:'Farmácia'},
  {custo:'Custo Variável',cat:'Saúde',      prod:'Atividade física'},
  {custo:'Custo Variável',cat:'Telefone',   prod:'Streaming/ ICloud'},
  {custo:'Custo Variável',cat:'Viagem',     prod:'Viagem'},
  {custo:'Custo Variável',cat:'Pessoal',    prod:'Cartão Crédito'},
  {custo:'Custo Fixo',    cat:'Trabalho',   prod:'Pag. Freelas'},
];
const CATS = [...new Set(CATS_DATA.map(c=>c.cat))];
const DONUT_COLORS = ['#D8E63C','#D6B4FC','#17184B','#273287','#D3DDE7','#b5c400','#9B59F5','#F0EEE9'];

/* ─── HELPERS ────────────────────────────────── */
const fmt  = v => v.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const fmtS = v => Math.abs(v)>=1000?'R$'+(v/1000).toFixed(1)+'k':fmt(v);
const now  = new Date();
const curMK= ()=>`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;
const getMK= d =>{const dt=new Date(d+'T12:00:00');return `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}`;};
const mkLbl= mk=>{const[y,m]=mk.split('-');return `${MONTHS[parseInt(m)-1]} ${y}`;};

function loadTx(){try{return JSON.parse(localStorage.getItem(LS))||[];}catch{return[];}}
function saveTx(t){localStorage.setItem(LS,JSON.stringify(t));}

function calcBal(txs){
  const b={dinheiro:0,va:0,cultura:0,poupanca:0};
  txs.forEach(t=>{if(b[t.conta]!==undefined)b[t.conta]+=t.type==='income'?t.value:-t.value;});
  return b;
}

let toastTimer;
function showToast(msg){
  const el=document.getElementById('toast');
  el.textContent=msg; el.style.display='block';
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>el.style.display='none',2400);
}

/* ─── MONTH OPTIONS ──────────────────────────── */
function monthOpts(){
  const s=new Set(txs.map(t=>getMK(t.date))); s.add(curMK());
  return [...s].sort().reverse();
}

/* ─── VALUE INPUT (cents) ────────────────────── */
function pushDigit(d){
  const next=cents*10+d; if(next>9999999)return;
  cents=next; updateValDisplay();
}
function popDigit(){
  cents=Math.floor(cents/10); updateValDisplay();
}
function updateValDisplay(){
  const el=document.getElementById('val-input'); if(!el)return;
  el.value=cents===0?'':(cents/100).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
}
function handleValKey(e){
  if(e.key==='Backspace'){popDigit();e.preventDefault();return;}
  if(/^\d$/.test(e.key)){pushDigit(parseInt(e.key,10));e.preventDefault();}
  else if(e.key!=='Tab')e.preventDefault();
}
function handleValChange(e){
  const digits=e.target.value.replace(/\D/g,'');
  if(!digits){cents=0;updateValDisplay();return;}
  cents=Math.min(parseInt(digits,10),9999999);
  updateValDisplay();
}

/* ─── BACKUP ─────────────────────────────────── */
function exportBk(){
  const b=new Blob([JSON.stringify(txs,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(b);
  a.download=`gestao2026_${new Date().toISOString().slice(0,10)}.json`;a.click();
  showToast('💾 Backup exportado!');
}
function importBk(input){
  const f=input.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=ev=>{
    try{
      const d=JSON.parse(ev.target.result);
      if(Array.isArray(d)){txs=d;saveTx(d);render();showToast(`✓ ${d.length} transações importadas!`);}
    }catch{showToast('⚠ Arquivo inválido!');}
  };
  r.readAsText(f);input.value='';
}

/* ─── DELETE ─────────────────────────────────── */
function delTx(id){
  txs=txs.filter(t=>t.id!==id);saveTx(txs);render();showToast('Transação removida.');
}

/* ─── SUBMIT ─────────────────────────────────── */
function handleSubmit(){
  if(cents<=0){showToast('⚠ Informe um valor válido');return;}
  const tx={
    id:Date.now()+Math.random(), type:txType, value:cents/100,
    conta:formState.conta,
    cat:  txType==='income'?'Entrada':formState.cat,
    prod: txType==='income'?(formState.srcIncome||'Receita'):formState.prod,
    custo:txType==='income'?'—':formState.custo,
    date: formState.date, detalhe:formState.detalhe,
  };
  txs=[tx,...txs]; saveTx(txs);
  cents=0; formState.detalhe=''; formState.srcIncome='';
  render();
  showToast(txType==='income'?'✓ Entrada registrada!':'✓ Despesa registrada!');
}

/* ─── CHART DRAWING (native Canvas) ──────────── */
function drawBarChart(canvasId, labels, incomeData, spendData){
  const canvas=document.getElementById(canvasId);
  if(!canvas)return;
  const ctx=canvas.getContext('2d');
  const W=canvas.offsetWidth||canvas.parentElement.offsetWidth||300;
  const H=160;
  canvas.width=W; canvas.height=H;
  ctx.clearRect(0,0,W,H);

  const all=[...incomeData,...spendData].filter(v=>v>0);
  const maxV=all.length?Math.max(...all)*1.15:100;
  const pad={t:10,r:10,b:30,l:44};
  const chartW=W-pad.l-pad.r;
  const chartH=H-pad.t-pad.b;
  const n=labels.length;
  const groupW=chartW/n;
  const barW=Math.min(groupW*.32,24);
  const gap=barW*.3;

  // grid lines
  const steps=4;
  ctx.strokeStyle='rgba(0,0,0,.06)';ctx.lineWidth=1;
  ctx.fillStyle='#AAAABC';ctx.font='10px system-ui';ctx.textAlign='right';
  for(let i=0;i<=steps;i++){
    const y=pad.t+chartH*(1-i/steps);
    ctx.beginPath();ctx.moveTo(pad.l,y);ctx.lineTo(W-pad.r,y);ctx.stroke();
    const val=maxV*i/steps;
    ctx.fillText(val>=1000?'R$'+(val/1000).toFixed(0)+'k':'R$'+val.toFixed(0), pad.l-4, y+3);
  }

  // bars
  labels.forEach((lbl,i)=>{
    const cx=pad.l+groupW*(i+.5);
    // income bar (yellow)
    const ih=Math.max(0,(incomeData[i]||0)/maxV*chartH);
    ctx.fillStyle='#D8E63C';
    const ix=cx-barW-gap/2;
    roundRect(ctx,ix,pad.t+chartH-ih,barW,ih,4);
    ctx.fill();
    // spend bar (violet)
    const sh=Math.max(0,(spendData[i]||0)/maxV*chartH);
    ctx.fillStyle='#D6B4FC';
    const sx=cx+gap/2;
    roundRect(ctx,sx,pad.t+chartH-sh,barW,sh,4);
    ctx.fill();
    // label
    ctx.fillStyle='#AAAABC';ctx.font='10px system-ui';ctx.textAlign='center';
    ctx.fillText(lbl,cx,H-8);
  });
}

function roundRect(ctx,x,y,w,h,r){
  if(h<r)r=h;
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.lineTo(x+w-r,y);
  ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h);
  ctx.lineTo(x,y+h);
  ctx.lineTo(x,y+r);
  ctx.quadraticCurveTo(x,y,x+r,y);
  ctx.closePath();
}

function drawDonutChart(canvasId, data){
  const canvas=document.getElementById(canvasId);
  if(!canvas)return;
  const size=Math.min(canvas.parentElement.offsetWidth||180,180);
  canvas.width=size;canvas.height=size;
  const ctx=canvas.getContext('2d');
  const cx=size/2,cy=size/2,r=size/2-10,ir=r*.65;
  let total=data.reduce((s,d)=>s+d.v,0);
  if(!total)return;
  let angle=-Math.PI/2;
  data.forEach(d=>{
    const slice=2*Math.PI*(d.v/total);
    ctx.beginPath();
    ctx.moveTo(cx,cy);
    ctx.arc(cx,cy,r,angle,angle+slice);
    ctx.closePath();
    ctx.fillStyle=d.c;
    ctx.fill();
    angle+=slice;
  });
  // donut hole
  ctx.beginPath();ctx.arc(cx,cy,ir,0,2*Math.PI);
  ctx.fillStyle='#fff';ctx.fill();
}

        <div class="tx-dt">${t.date}</div>
      </div>
      <button class="tx-del" onclick="delTx(${t.id})">🗑</button>
    </div>`;
  }).join('')}</div>`;
}

function setTxType(type){
  txType=type; render();
}

function updateProdutos(){
  const sel=document.getElementById('prod-sel');if(!sel)return;
  const prods=CATS_DATA.filter(c=>c.cat===formState.cat);
  sel.innerHTML=prods.map(p=>`<option value="${p.prod}">${p.prod}</option>`).join('');
  formState.prod=prods[0]?.prod||'';
  formState.custo=prods[0]?.custo||'Custo Variável';
}

function updateCusto(){
  const m=CATS_DATA.find(c=>c.prod===formState.prod&&c.cat===formState.cat);
  if(m)formState.custo=m.custo;
}

function destroyCharts(){
  // nothing to destroy for native canvas
}

// initial render
render();
</script>
</body>
</html>
