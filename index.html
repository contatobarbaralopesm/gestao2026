<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Gestão 2026</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap');
:root {
  /* Palette */
  --tang:    #EB4600;
  --tang-lt: #FFF0EA;
  --tang-md: #FF6B35;
  --ash:     #A2C2BE;
  --ash-lt:  #EBF4F3;
  --ash-dk:  #6B9E99;
  --powder:  #FFFFEB;
  /* Semantic */
  --bg:      #F7F5EE;
  --surface: rgba(255,255,255,0.82);
  --surface-solid: #FFFFFF;
  --surface2:rgba(255,255,255,0.5);
  --border:  rgba(162,194,190,0.3);
  --border2: rgba(162,194,190,0.5);
  --pos:     #2D9E6B;
  --pos-bg:  rgba(45,158,107,0.1);
  --neg:     #E03B2A;
  --neg-bg:  rgba(224,59,42,0.1);
  --text:    #1C1C1C;
  --text2:   #5A5A5A;
  --text3:   #A0A0A0;
  --font:    'Poppins',system-ui,-apple-system,sans-serif;
  --r:       22px;
  --r-sm:    14px;
  --blur:    blur(20px);
  --shadow:  0 8px 32px rgba(0,0,0,0.08);
  --shadow-sm:0 2px 12px rgba(0,0,0,0.06);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;font-family:var(--font);background:var(--bg);color:var(--text);font-size:14px;-webkit-font-smoothing:antialiased}
body::before{
  content:'';position:fixed;inset:0;z-index:-1;
  background:
    radial-gradient(ellipse 60% 40% at 80% 10%, rgba(235,70,0,.12) 0%, transparent 60%),
    radial-gradient(ellipse 50% 50% at 10% 80%, rgba(162,194,190,.2) 0%, transparent 60%),
    #F7F5EE;
}
::-webkit-scrollbar{width:3px;height:3px}
::-webkit-scrollbar-thumb{background:var(--ash);border-radius:4px}

/* ── SHELL ── */
.shell{display:flex;flex-direction:column;min-height:100dvh;max-width:430px;margin:0 auto}
@media(min-width:900px){
  .shell{flex-direction:row;max-width:1160px}
  #sidebar{display:flex!important}
  #bottom-nav{display:none!important}
  #top-bar{display:none!important}
  #main{padding:32px 40px 40px}
  .cards-row{grid-template-columns:repeat(4,1fr)!important}
  .dash-charts{grid-template-columns:1fr 1fr!important}
  .form-row{grid-template-columns:1fr 1fr!important}
}

/* ── SIDEBAR ── */
#sidebar{
  display:none;flex-direction:column;
  width:230px;flex-shrink:0;
  background:var(--surface);
  backdrop-filter:var(--blur);
  -webkit-backdrop-filter:var(--blur);
  border-right:1px solid var(--border2);
  padding:28px 16px;
  position:sticky;top:0;height:100dvh;overflow-y:auto;
}
.s-logo{padding:4px 10px 24px;border-bottom:1px solid var(--border2);margin-bottom:12px}
.s-logo h1{font-size:19px;font-weight:700;letter-spacing:-.4px;color:var(--text)}
.s-logo h1 em{font-style:normal;color:var(--tang)}
.s-logo p{font-size:11px;color:var(--text3);margin-top:2px}
.snav{display:flex;flex-direction:column;gap:2px}
.snav-item{
  display:flex;align-items:center;gap:10px;
  padding:11px 12px;border-radius:14px;
  font-size:13px;font-weight:500;color:var(--text2);
  cursor:pointer;transition:.18s;user-select:none;
}
.snav-item:hover{background:rgba(235,70,0,.06);color:var(--tang)}
.snav-item.active{background:var(--tang);color:#fff;box-shadow:0 4px 14px rgba(235,70,0,.3)}
.snav-item svg{flex-shrink:0;opacity:.7}
.snav-item.active svg{opacity:1}
.s-bottom{margin-top:auto;padding-top:16px;border-top:1px solid var(--border2);display:flex;flex-direction:column;gap:6px}

/* ── TOP BAR mobile ── */
#top-bar{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 18px 12px;
  background:rgba(255,255,255,.75);
  backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
  border-bottom:1px solid var(--border2);
  position:sticky;top:0;z-index:50;
}
.top-logo{font-size:17px;font-weight:700;color:var(--text)}
.top-logo em{font-style:normal;color:var(--tang)}
.top-actions{display:flex;gap:6px}

/* ── MAIN ── */
#main{flex:1;padding:20px 16px 100px;overflow-y:auto}

/* ── BOTTOM NAV ── */
#bottom-nav{
  position:fixed;bottom:0;left:50%;transform:translateX(-50%);
  width:100%;max-width:430px;
  background:rgba(255,255,255,.85);
  backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
  border-top:1px solid var(--border2);
  display:flex;
  padding:10px 0 calc(10px + env(safe-area-inset-bottom));
  z-index:50;
}
.bnav-item{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
  cursor:pointer;padding:2px 0;color:var(--text3);font-size:10px;font-weight:500;
  transition:.18s;user-select:none;
}
.bnav-item.active{color:var(--tang)}
.bnav-icon{
  width:38px;height:38px;border-radius:12px;
  display:flex;align-items:center;justify-content:center;transition:.18s;
}
.bnav-item.active .bnav-icon{
  background:var(--tang-lt);
  box-shadow:0 2px 10px rgba(235,70,0,.2);
}

/* ── GLASS CARD ── */
.glass{
  background:var(--surface);
  backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
  border:1px solid var(--border2);
  border-radius:var(--r);
  box-shadow:var(--shadow-sm);
}

/* ── BUTTONS ── */
.btn{
  display:inline-flex;align-items:center;gap:7px;
  padding:8px 14px;border-radius:12px;
  border:1px solid var(--border2);
  background:var(--surface2);
  backdrop-filter:var(--blur);
  color:var(--text2);font-family:var(--font);font-size:12px;font-weight:500;
  cursor:pointer;transition:.15s;white-space:nowrap;
}
.btn:hover{border-color:var(--tang);color:var(--tang);background:var(--tang-lt)}
.btn-primary{
  background:var(--tang);border:none;color:#fff;
  font-size:15px;font-weight:600;width:100%;
  justify-content:center;padding:14px;border-radius:16px;
  font-family:var(--font);
  box-shadow:0 4px 16px rgba(235,70,0,.3);
  transition:.18s;
}
.btn-primary:hover{background:#c93c00;box-shadow:0 6px 20px rgba(235,70,0,.4)}
.btn-primary:active{transform:scale(.98)}
.btn-pos{
  background:var(--pos);border:none;color:#fff;
  font-size:15px;font-weight:600;width:100%;
  justify-content:center;padding:14px;border-radius:16px;
  font-family:var(--font);
  box-shadow:0 4px 16px rgba(45,158,107,.3);
  transition:.18s;
}
.btn-pos:hover{background:#237a54}
.btn-pos:active{transform:scale(.98)}

/* ── PAGE HEADER ── */
.ph{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:20px;gap:10px;flex-wrap:wrap}
.ph-title{font-size:24px;font-weight:700;letter-spacing:-.5px;color:var(--text)}
.ph-sub{font-size:11px;color:var(--text3);margin-top:2px;font-weight:400}

/* ── MONTH PILL ── */
.mpill{
  background:var(--surface);backdrop-filter:var(--blur);
  border:1px solid var(--border2);border-radius:20px;
  padding:7px 16px;font-family:var(--font);font-size:12px;font-weight:500;
  color:var(--text2);cursor:pointer;appearance:none;outline:none;
  transition:.15s;
}
.mpill:focus{border-color:var(--tang)}

/* ── HERO ── */
.hero{
  background:linear-gradient(135deg,var(--tang) 0%,#c93c00 100%);
  border-radius:var(--r);padding:24px 22px;margin-bottom:14px;
  position:relative;overflow:hidden;
  box-shadow:0 8px 32px rgba(235,70,0,.25);
}
.hero::before{
  content:'';position:absolute;
  width:160px;height:160px;border-radius:50%;
  background:rgba(255,255,255,.08);right:-40px;top:-50px;
}
.hero::after{
  content:'';position:absolute;
  width:100px;height:100px;border-radius:50%;
  background:rgba(255,255,255,.06);right:60px;bottom:-40px;
}
.hero-lbl{font-size:11px;font-weight:500;color:rgba(255,255,255,.6);text-transform:uppercase;letter-spacing:.7px;margin-bottom:6px}
.hero-val{font-size:38px;font-weight:700;letter-spacing:-2px;line-height:1;color:#fff;position:relative;z-index:1}
.hero-chips{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap;position:relative;z-index:1}
.hchip{
  border-radius:20px;padding:6px 14px;font-size:12px;font-weight:600;
  display:inline-flex;align-items:center;gap:6px;
}
.hchip.in{background:rgba(255,255,255,.18);color:#fff;border:1px solid rgba(255,255,255,.3)}
.hchip.out{background:rgba(0,0,0,.15);color:rgba(255,255,255,.85);border:1px solid rgba(255,255,255,.1)}

/* ── ACCOUNT CARDS ── */
.cards-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.acard{
  padding:16px;border-radius:var(--r);position:relative;overflow:hidden;
  transition:.2s;cursor:default;
}
.acard:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,.1)}
.acard-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.acard-ico{
  width:38px;height:38px;border-radius:12px;
  display:flex;align-items:center;justify-content:center;
  background:rgba(255,255,255,.4);
}
.acard-lbl{font-size:10px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.6px;margin-bottom:4px}
.acard-val{font-size:21px;font-weight:700;letter-spacing:-.8px;line-height:1.1;color:var(--text)}
.acard-meta{font-size:10px;color:var(--text3);margin-top:6px;display:flex;gap:10px}
.m-in{color:var(--pos);font-weight:600}
.m-out{color:var(--neg);font-weight:600}
/* Card variants */
.acard-tang{background:linear-gradient(135deg,#EB4600,#FF6B35);box-shadow:0 6px 20px rgba(235,70,0,.25)}
.acard-tang .acard-lbl,.acard-tang .acard-meta{color:rgba(255,255,255,.6)}
.acard-tang .acard-val{color:#fff}
.acard-tang .m-in,.acard-tang .m-out{color:rgba(255,255,255,.85)}
.acard-ash{background:linear-gradient(135deg,#A2C2BE,#6B9E99);box-shadow:0 6px 20px rgba(107,158,153,.25)}
.acard-ash .acard-lbl,.acard-ash .acard-meta{color:rgba(255,255,255,.65)}
.acard-ash .acard-val{color:#fff}
.acard-ash .m-in,.acard-ash .m-out{color:rgba(255,255,255,.9)}
.acard-powder{background:linear-gradient(135deg,#FFFFEB,#F5F0D0);border:1px solid rgba(235,70,0,.15);box-shadow:0 4px 16px rgba(0,0,0,.06)}
.acard-plain{background:var(--surface);backdrop-filter:var(--blur);border:1px solid var(--border2);box-shadow:var(--shadow-sm)}

/* ── CHARTS ── */
.dash-charts{display:grid;grid-template-columns:1fr;gap:12px;margin-bottom:14px}
.chart-card{padding:20px}
.cc-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:8px}
.cc-title{font-size:14px;font-weight:600;color:var(--text)}
.cc-pill{font-size:11px;font-weight:500;background:rgba(235,70,0,.08);border:1px solid rgba(235,70,0,.15);border-radius:20px;padding:4px 12px;color:var(--tang)}
.stat-row{display:flex;gap:24px;margin-bottom:14px}
.stat-lbl{font-size:11px;color:var(--text3);margin-bottom:2px;font-weight:400}
.stat-val{font-size:22px;font-weight:700;letter-spacing:-1px}
.legend-row{display:flex;align-items:center;gap:14px;font-size:11px;font-weight:600;color:var(--text2)}
.leg-dot{width:10px;height:10px;border-radius:3px;display:inline-block;margin-right:4px}
canvas{display:block}

/* Bubbles */
.bubble-row{display:flex;align-items:center;justify-content:center;margin-bottom:14px;height:110px}
.bubble{border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 4px 16px rgba(0,0,0,.1)}
.b-ico{line-height:1}
.b-lbl{font-size:9px;font-weight:600;margin-top:2px;opacity:.8}

/* Progress */
.prog-list{display:flex;flex-direction:column;gap:10px}
.prog-hd{display:flex;justify-content:space-between;font-size:12px;font-weight:500;margin-bottom:5px;color:var(--text2)}
.prog-bar{height:6px;background:rgba(162,194,190,.2);border-radius:3px;overflow:hidden}
.prog-fill{height:100%;border-radius:3px;transition:width .8s cubic-bezier(.4,0,.2,1)}

/* Rate */
.rate-num{font-size:46px;font-weight:700;letter-spacing:-3px;line-height:1;margin:8px 0 3px}
.rate-bar{height:8px;background:rgba(162,194,190,.2);border-radius:4px;margin-top:12px;overflow:hidden}
.rate-fill{height:100%;border-radius:4px;transition:width .8s}
.fv-row{display:flex;gap:8px;margin-top:14px}
.fv-box{flex:1;border-radius:16px;padding:14px;text-align:center}
.fv-lbl{font-size:11px;font-weight:600;margin-bottom:5px}
.fv-val{font-size:17px;font-weight:700;letter-spacing:-.5px}
.fv-pct{font-size:10px;margin-top:3px;opacity:.7}

/* ── FORM ── */
.form-card{padding:22px;margin-bottom:14px}
.type-toggle{display:flex;background:rgba(162,194,190,.15);border-radius:14px;padding:3px;gap:3px;margin-bottom:20px}
.tog-btn{
  flex:1;padding:10px 0;border-radius:11px;border:none;
  font-family:var(--font);font-size:13px;font-weight:600;
  cursor:pointer;transition:.2s;
  background:transparent;color:var(--text3);
  display:flex;align-items:center;justify-content:center;gap:7px;
}
.tog-btn svg{transition:.2s}
.tog-btn.active-exp{background:#fff;color:var(--neg);box-shadow:0 2px 10px rgba(0,0,0,.08)}
.tog-btn.active-inc{background:#fff;color:var(--pos);box-shadow:0 2px 10px rgba(0,0,0,.08)}
.form-stack{display:flex;flex-direction:column;gap:13px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fg{display:flex;flex-direction:column;gap:6px}
.flbl{font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.6px;display:flex;align-items:center;gap:5px}
.fi,.fs{
  background:rgba(255,255,255,.7);
  backdrop-filter:var(--blur);
  border:1.5px solid var(--border2);
  border-radius:13px;padding:12px 14px;
  color:var(--text);font-family:var(--font);font-size:14px;font-weight:400;
  outline:none;transition:.18s;width:100%;appearance:none;
}
.fi:focus,.fs:focus{border-color:var(--tang);box-shadow:0 0 0 3px rgba(235,70,0,.1);background:#fff}
.fi::placeholder{color:var(--text3)}
.val-fi{font-size:26px;font-weight:700;letter-spacing:-.5px;caret-color:transparent;padding:14px 16px}

/* Quick bals */
.quick-bals{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.qbal{padding:14px 15px}
.qbal-lbl{font-size:10px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px;display:flex;align-items:center;gap:5px}
.qbal-val{font-size:18px;font-weight:700;letter-spacing:-.4px}
.qbal-val.pos{color:var(--pos)}.qbal-val.neg{color:var(--neg)}

/* ── EXTRATO ── */
.table-card{overflow:hidden}
.table-hd{
  padding:16px 18px;border-bottom:1px solid var(--border2);
  display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;
}
.table-title{font-size:14px;font-weight:600;color:var(--text)}
.tcount{
  font-size:11px;font-weight:600;
  background:var(--tang);color:#fff;
  padding:3px 11px;border-radius:20px;
  box-shadow:0 2px 8px rgba(235,70,0,.3);
}
.tx-list{display:flex;flex-direction:column}
.tx-item{
  display:flex;align-items:center;gap:12px;
  padding:13px 18px;border-bottom:1px solid var(--border);
  transition:.12s;cursor:default;
}
.tx-item:last-child{border-bottom:none}
.tx-item:hover{background:rgba(235,70,0,.03)}
.cat-ico{
  width:42px;height:42px;border-radius:14px;
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
}
.tx-body{flex:1;min-width:0}
.tx-name{font-size:13px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx-tags{display:flex;align-items:center;gap:3px;margin-top:3px;flex-wrap:wrap}
.tx-detail{font-size:11px;color:var(--text3);margin-top:1px}
.tx-right{text-align:right;flex-shrink:0}
.tx-amt{font-size:14px;font-weight:700;letter-spacing:-.3px}
.tx-amt.out{color:var(--neg)}.tx-amt.in{color:var(--pos)}
.tx-dt{font-size:10px;color:var(--text3);margin-top:1px}
.tx-del{
  background:none;border:none;cursor:pointer;
  color:var(--text3);padding:6px;border-radius:8px;
  display:flex;align-items:center;transition:.15s;flex-shrink:0;
}
.tx-del:hover{color:var(--neg);background:var(--neg-bg)}
.tag{display:inline-flex;align-items:center;padding:2px 8px;border-radius:20px;font-size:10px;font-weight:600;white-space:nowrap}
.tag-fixo{background:#FFF3E0;color:#B45309}
.tag-var{background:var(--ash-lt);color:var(--ash-dk)}
.tag-dinheiro{background:var(--pos-bg);color:var(--pos)}
.tag-va{background:rgba(235,70,0,.1);color:var(--tang)}
.tag-cultura{background:var(--ash-lt);color:var(--ash-dk)}
.tag-poupanca{background:rgba(162,194,190,.2);color:var(--ash-dk)}
.table-footer{
  padding:12px 18px;border-top:1px solid var(--border2);
  background:rgba(255,255,255,.4);
  display:flex;gap:20px;flex-wrap:wrap;font-size:12px;font-weight:500;color:var(--text2);
}
.table-footer strong{color:var(--text);font-weight:700}

/* ── TOAST ── */
#toast{
  position:fixed;bottom:90px;left:50%;transform:translateX(-50%);
  background:rgba(28,28,28,.92);
  backdrop-filter:var(--blur);
  color:#fff;padding:12px 22px;border-radius:20px;
  font-size:13px;font-weight:500;z-index:200;
  white-space:nowrap;box-shadow:0 6px 28px rgba(0,0,0,.2);
  display:none;animation:fadeUp .25s ease;
}
@keyframes fadeUp{from{opacity:0;transform:translateX(-50%) translateY(8px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
@media(min-width:900px){#toast{bottom:28px}}

/* ── BACKUP MODAL ── */
#bk-overlay{
  position:fixed;inset:0;z-index:300;
  background:rgba(0,0,0,.35);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  display:none;align-items:center;justify-content:center;padding:24px;
}
#bk-overlay.open{display:flex;animation:fadeIn .2s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.bk-modal{
  background:#fff;border-radius:24px;padding:28px 24px;
  max-width:340px;width:100%;text-align:center;
  box-shadow:0 20px 60px rgba(0,0,0,.15);
  animation:slideUp .25s ease;
}
@keyframes slideUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.bk-icon{
  width:64px;height:64px;border-radius:20px;
  background:var(--tang-lt);display:flex;align-items:center;justify-content:center;
  margin:0 auto 16px;color:var(--tang);
}
.bk-modal h2{font-size:18px;font-weight:700;margin-bottom:8px;color:var(--text)}
.bk-modal p{font-size:13px;color:var(--text2);line-height:1.6;margin-bottom:20px}
.bk-days{
  display:inline-block;background:var(--tang-lt);color:var(--tang);
  font-weight:700;padding:2px 10px;border-radius:20px;font-size:13px;
}
.bk-actions{display:flex;flex-direction:column;gap:8px}
.bk-btn-main{
  background:var(--tang);color:#fff;border:none;
  padding:13px;border-radius:14px;font-family:var(--font);
  font-size:14px;font-weight:600;cursor:pointer;
  box-shadow:0 4px 16px rgba(235,70,0,.3);transition:.15s;
}
.bk-btn-main:hover{background:#c93c00}
.bk-btn-skip{
  background:none;border:1px solid var(--border2);color:var(--text2);
  padding:11px;border-radius:14px;font-family:var(--font);
  font-size:13px;font-weight:500;cursor:pointer;transition:.15s;
}
.bk-btn-skip:hover{background:var(--tang-lt);color:var(--tang);border-color:var(--tang)}

/* ── MISC ── */
.empty{padding:44px 24px;text-align:center;color:var(--text3);font-size:13px;line-height:1.8}
input[type=file]{display:none}

/* SVG icon sizes */
.ico-16{width:16px;height:16px}

/* ═══════════════════════════════════════════
   HELPERS
═══════════════════════════════════════════ */
const fmt  = v => v.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const fmtS = v => Math.abs(v)>=1000?'R$'+(v/1000).toFixed(1)+'k':fmt(v);
const now  = new Date();
const curMK= ()=>`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;
const getMK= d=>{const dt=new Date(d+'T12:00:00');return `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}`;};
const mkLbl= mk=>{const[y,m]=mk.split('-');return `${MONTHS[parseInt(m)-1]} ${y}`;};
function loadTx(){try{return JSON.parse(localStorage.getItem(LS))||[];}catch{return[];}}
function saveTx(t){localStorage.setItem(LS,JSON.stringify(t));}
function calcBal(txs){
  const b={dinheiro:0,va:0,cultura:0,poupanca:0};
  txs.forEach(t=>{if(b[t.conta]!==undefined)b[t.conta]+=t.type==='income'?t.value:-t.value;});
  return b;
}

/* ═══════════════════════════════════════════
   BACKUP REMINDER
═══════════════════════════════════════════ */
const BK_DAYS = 7;
function getLastBkDate(){
  const s=localStorage.getItem(LS_BK);
  return s?new Date(s):null;
}
function setLastBkDate(){localStorage.setItem(LS_BK,new Date().toISOString());}
function daysSinceLastBk(){
  const d=getLastBkDate();
  if(!d)return 999;
  return Math.floor((Date.now()-d.getTime())/(1000*60*60*24));
}
function checkBkReminder(){
  const days=daysSinceLastBk();
  if(days>=BK_DAYS && loadTx().length>0){
    document.getElementById('bk-days-txt').textContent=
      days>=999?'muito tempo':days===1?'1 dia':`${days} dias`;
    document.getElementById('bk-overlay').classList.add('open');
  }
}
function dismissBkModal(){
  document.getElementById('bk-overlay').classList.remove('open');
  // snooze 2 days
  const snooze=new Date(Date.now()-((BK_DAYS-2)*24*60*60*1000));
  localStorage.setItem(LS_BK,snooze.toISOString());
}
function doBkExport(){
  exportBk();
  document.getElementById('bk-overlay').classList.remove('open');
}

/* ═══════════════════════════════════════════
   TOAST
═══════════════════════════════════════════ */
let toastTimer;
function showToast(msg){
  const el=document.getElementById('toast');
  el.textContent=msg;el.style.display='block';
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>el.style.display='none',2400);
}

/* ═══════════════════════════════════════════
   STATE
═══════════════════════════════════════════ */
let txs    = loadTx();
let selMK  = curMK();
let txType = 'expense';
let cents  = 0;
let formState = {
  conta:'dinheiro',cat:'Alimentação',prod:'Supermercado',custo:'Custo Variável',
  date:now.toISOString().slice(0,10),detalhe:'',srcIncome:'',
};

/* ═══════════════════════════════════════════
   NAVIGATION
═══════════════════════════════════════════ */
let currentPage='dashboard';
function navigate(page){
  currentPage=page;
  document.querySelectorAll('.snav-item,.bnav-item').forEach(el=>{
    el.classList.toggle('active',el.dataset.page===page);
  });
  render();
}
document.querySelectorAll('.snav-item,.bnav-item').forEach(el=>{
  el.addEventListener('click',()=>navigate(el.dataset.page));
});

/* ═══════════════════════════════════════════
   VALUE INPUT (cents)
═══════════════════════════════════════════ */
function pushDigit(d){const n=cents*10+d;if(n>9999999)return;cents=n;updateValDisplay();}
function popDigit(){cents=Math.floor(cents/10);updateValDisplay();}
function updateValDisplay(){
  const el=document.getElementById('val-input');if(!el)return;
  el.value=cents===0?'':(cents/100).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
}
function handleValKey(e){
  if(e.key==='Backspace'){popDigit();e.preventDefault();return;}
  if(/^\d$/.test(e.key)){pushDigit(parseInt(e.key,10));e.preventDefault();}
  else if(e.key!=='Tab')e.preventDefault();
}
function handleValChange(e){
  const digits=e.target.value.replace(/\D/g,'');
  if(!digits){cents=0;updateValDisplay();return;}
  cents=Math.min(parseInt(digits,10),9999999);updateValDisplay();
}

/* ═══════════════════════════════════════════
   BACKUP
═══════════════════════════════════════════ */
function exportBk(){
  const b=new Blob([JSON.stringify(txs,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(b);
  a.download=`gestao2026_${new Date().toISOString().slice(0,10)}.json`;a.click();
  setLastBkDate();
  showToast('✓ Backup exportado com sucesso!');
}
function importBk(input){
  const f=input.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=ev=>{
    try{
      const d=JSON.parse(ev.target.result);
      if(Array.isArray(d)){txs=d;saveTx(d);render();showToast(`✓ ${d.length} transações importadas!`);}
    }catch{showToast('⚠ Arquivo inválido!');}
  };
  r.readAsText(f);input.value='';
}

/* ═══════════════════════════════════════════
   CRUD
═══════════════════════════════════════════ */
function delTx(id){
  txs=txs.filter(t=>t.id!==id);saveTx(txs);render();showToast('Transação removida.');
}
function handleSubmit(){
  if(cents<=0){showToast('⚠ Informe um valor válido');return;}
  const tx={
    id:Date.now()+Math.random(),type:txType,value:cents/100,conta:formState.conta,
    cat:  txType==='income'?'Entrada':formState.cat,
    prod: txType==='income'?(formState.srcIncome||'Receita'):formState.prod,
    custo:txType==='income'?'—':formState.custo,
    date: formState.date,detalhe:formState.detalhe,
  };
  txs=[tx,...txs];saveTx(txs);
  cents=0;formState.detalhe='';formState.srcIncome='';
  render();
  showToast(txType==='income'?'✓ Entrada registrada!':'✓ Despesa registrada!');
}
function setTxType(t){txType=t;render();}
function updateProdutos(){
  const s=document.getElementById('prod-sel');if(!s)return;

/* ═══════════════════════════════════════════
   CANVAS CHARTS
═══════════════════════════════════════════ */
function roundRect(ctx,x,y,w,h,r){
  if(h<1)return;if(h<r)r=h;
  ctx.beginPath();
  ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);
  ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h);ctx.lineTo(x,y+h);ctx.lineTo(x,y+r);
  ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath();
}
function drawBar(id,labels,inc,exp){
  const canvas=document.getElementById(id);if(!canvas)return;
  const W=canvas.parentElement.offsetWidth||320;const H=160;
  canvas.width=W*2;canvas.height=H*2;canvas.style.width=W+'px';canvas.style.height=H+'px';
  const ctx=canvas.getContext('2d');ctx.scale(2,2);
  ctx.clearRect(0,0,W,H);
  const all=[...inc,...exp].filter(v=>v>0);
  const maxV=all.length?Math.max(...all)*1.2:100;
  const pad={t:8,r:8,b:28,l:46};
  const cW=W-pad.l-pad.r;const cH=H-pad.t-pad.b;
  const n=labels.length||1;
  const gW=cW/n;const bW=Math.min(gW*.3,18);const gap=bW*.4;
  // grid
  ctx.strokeStyle='rgba(162,194,190,.2)';ctx.lineWidth=1;
  ctx.fillStyle='#A0A0A0';ctx.font='9px system-ui';ctx.textAlign='right';
  for(let i=0;i<=4;i++){
    const y=pad.t+cH*(1-i/4);
    ctx.beginPath();ctx.moveTo(pad.l,y);ctx.lineTo(W-pad.r,y);ctx.stroke();
    const v=maxV*i/4;
    ctx.fillText(v>=1000?'R$'+(v/1000).toFixed(0)+'k':'R$'+Math.round(v),pad.l-4,y+3);
  }
  labels.forEach((lbl,i)=>{
    const cx=pad.l+gW*(i+.5);
    // income
    const ih=Math.max(0,(inc[i]||0)/maxV*cH);
    ctx.fillStyle='#2D9E6B';
    roundRect(ctx,cx-bW-gap/2,pad.t+cH-ih,bW,ih,4);ctx.fill();
    // expense
    const eh=Math.max(0,(exp[i]||0)/maxV*cH);
    ctx.fillStyle='#EB4600';
    roundRect(ctx,cx+gap/2,pad.t+cH-eh,bW,eh,4);ctx.fill();
    // label
    ctx.fillStyle='#A0A0A0';ctx.font='9px system-ui';ctx.textAlign='center';
    ctx.fillText(lbl,cx,H-8);
  });
}

          return`<div class="qbal glass">

              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${m.svg.replace(/<svg[^>]*>/,'').replace('</svg>','')}</svg>
              ${m.label}
            </div>
            <div class="qbal-val ${bal>=0?'pos':'neg'}">${fmt(bal)}</div>
          </div>`;
        }).join('')}
      </div>
    `;
  }

  /* ── EXTRATO ── */
  else if(currentPage==='extrato'){
    main.innerHTML=`
      <div class="ph">
        <div><div class="ph-title">Extrato</div><div class="ph-sub">todos os lançamentos</div></div>
        ${monthSelHTML}
      </div>
      <div class="table-card glass">
        <div class="table-hd">
          <div class="table-title">${mkLbl(selMK)}</div>
          <span class="tcount">${filtered.length} lançamentos</span>
        </div>
        ${filtered.length===0
          ?`<div class="empty">Nenhuma transação neste mês.</div>`
          :txListHTML(filtered,true)
        }
        ${filtered.length>0?`<div class="table-footer">
          <span>${svgIco('<line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/>',12,2)} <strong style="color:var(--pos)">${fmt(totalInc)}</strong></span>
          <span>${svgIco('<line x1="12" y1="5" x2="12" y2="19"/><polyline points="19 12 12 19 5 12"/>',12,2)} <strong style="color:var(--neg)">${fmt(totalExp)}</strong></span>
          <span>= <strong style="color:${totalInc-totalExp>=0?'var(--pos)':'var(--neg)'}">${fmt(totalInc-totalExp)}</strong></span>
        </div>`:''}
      </div>
    `;
  }
}

// boot
render();
checkBkReminder();
</script>
</body>
</html>
